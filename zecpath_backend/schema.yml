openapi: 3.0.3
info:
  title: Zecpath Recruitment Platform API
  version: 1.0.0
  description: REST APIs for the AI-powered Zecpath Recruitment Platform.
paths:
  /api/admin/employers/:
    get:
      operationId: api_admin_employers_list
      description: Retrieve all employers.
      summary: List Employers
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin Management
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployerList'
          description: ''
    post:
      operationId: api_admin_employers_create
      summary: Create Employer
      tags:
      - Admin Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employer'
          description: ''
